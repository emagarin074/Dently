exclude: '^(?:\.venv|venv|node_modules|\.next)/'

repos:
  # 1. Basic File Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json

  # 2. Prettier (Code Formatting - TS/JS/CSS)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        language: system
        entry: npx --no-install prettier --write
        files: \.(js|jsx|ts|tsx|json|css|md)$
        types: [file]

  # 3. ESLint (Linting - TS/JS)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: system
        entry: npm run lint -- --fix
        files: \.[jt]sx?$
        types: [file]
        pass_filenames: false

  # 4. TypeScript Type Check
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript Type Check
        language: system
        entry: npx tsc --noEmit
        files: \.[jt]sx?$
        types: [file]
        pass_filenames: false

  # 5. Gitleaks (Secrets Detection)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # 6. Trivy (Dependency Scan)
  - repo: local
    hooks:
      - id: trivy
        name: Trivy Security Scan
        language: system
        entry: trivy
        stages: [pre-push]
        args:
          [
            "--timeout",
            "30m",
            "fs",
            ".",
            "--severity",
            "HIGH,CRITICAL",
            "--exit-code",
            "1",
            "--scanners",
            "vuln,misconfig",
            "--skip-dirs",
            ".next",
          ]
        pass_filenames: false

  # 7. Frontend Build
  - repo: local
    hooks:
      - id: frontend-build
        name: Next.js Build
        entry: npm run build
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false
        stages: [pre-push]
        verbose: true
