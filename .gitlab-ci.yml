stages:
  - test
  - security

# Global defaults for our custom Node jobs
default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  # Bonus: Highly recommended standard security scans
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# 1. Linting Scan
lint:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 2. Unit Testing (Backend & Frontend via Vitest)
unit_test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npx vitest run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 3. Security Scans
dependency_scanning:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    NPM_TOKEN: "$NPM_AUTH_TOKEN"
